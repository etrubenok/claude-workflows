# On-demand Claude: respond when a human writes @claude in a PR or issue comment.
#
# Kept separate from claude-review.yml on purpose: a workflow subscribed to issue_comment records a (skipped) run
# for EVERY comment, and the review workflow's run list must equal the list of actual reviews — the factory reads
# that list to tell a finished review from one that never ran. Same auth as the review (CLAUDE_CODE_OAUTH_TOKEN);
# skips cleanly without it.

name: Claude Mention

on:
  issue_comment:
    types: [created]

jobs:
  mention:
    if: >-
      github.event.sender.type != 'Bot' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest   # or your self-hosted runner's labels
    # Each @claude mention is independent — never cancel a mid-flight response.
    concurrency:
      group: claude-mention-${{ github.event.comment.id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Skip notice (no token yet)
        if: env.HAS_TOKEN != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN not set — skipping. Run 'claude setup-token' and add the secret to enable."

      - name: Claude (mention)
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The same pinned model as the review, never the account default.
          claude_args: '--model claude-opus-5-5'
