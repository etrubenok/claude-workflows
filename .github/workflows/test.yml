# The factory's own tests: shellcheck (errors) over every script, then the scenario tests, which run the driver,
# the installer and the helpers on scratch state with fakes of gh, claude and systemctl — nothing reaches GitHub
# or starts a session.
name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Shellcheck
        run: shellcheck -x -S error scripts/*.sh tests/*.sh
      - name: Tests
        run: bash tests/run.sh
