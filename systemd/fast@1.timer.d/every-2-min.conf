# Fast-lane worker 1 looks every 2 min, not the template's 5: it alone picks, checks and closes, so a finished step
# waits for it at most 2 min instead of 5. The empty OnCalendar= clears the template's value first; without it both
# calendars fire. Workers above 1 keep 5 min.
[Timer]
OnCalendar=
OnCalendar=*-*-* *:0/2:00 UTC
